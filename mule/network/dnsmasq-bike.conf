# dnsmasq config for the mule's dedicated bike interface (10.42.42.0/24)
# Interface name: eth-bike (or whatever USB-ethernet adapter shows up as)
# Start with: sudo dnsmasq -C /path/to/dnsmasq-bike.conf --no-daemon

interface=eth-bike
bind-interfaces
dhcp-range=10.42.42.100,10.42.42.200,12h
dhcp-option=3,10.42.42.1    # default gateway = mule
dhcp-option=6,10.42.42.1    # DNS = mule (dnsmasq handles it)
log-dhcp
