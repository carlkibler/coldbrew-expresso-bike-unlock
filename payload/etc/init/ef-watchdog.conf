# Upstart job for ef_global.conf watchdog.
# See /usr/local/bin/ef-watchdog.sh — re-applies our LocationName +
# BikeSubscription whenever the game rewrites the file.

description "ef_global.conf watchdog (Coldbrew)"

start on runlevel [2345]
stop on runlevel [!2345]

respawn
respawn limit 10 5

exec /usr/local/bin/ef-watchdog.sh
